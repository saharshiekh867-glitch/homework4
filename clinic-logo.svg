<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="100" fill="#e8f4f8" rx="5"/>
  
  <!-- Logo circle/medical symbol -->
  <circle cx="40" cy="50" r="25" fill="#0066cc" stroke="#004499" stroke-width="2"/>
  <rect x="35" y="30" width="10" height="40" fill="white"/>
  <rect x="25" y="45" width="30" height="10" fill="white"/>
  
  <!-- Text -->
  <text x="75" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0066cc">The Family</text>
  <text x="75" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0066cc">Clinic</text>
  
  <!-- Border -->
  <rect width="200" height="100" fill="none" stroke="#0066cc" stroke-width="2" rx="5"/>
</svg>